var KINDS = ["粮食", "木材", "铁矿", "石料"];
var SHORT = { "粮食": "粮", "木材": "木", "铁矿": "铁", "石料": "石" };
var MAP = {}, NAMES = [];
DATA.forEach(function (r) {
  if (!MAP[r[0]]) { MAP[r[0]] = []; NAMES.push(r[0]); }
  MAP[r[0]].push({ k: r[1], coord: r[2], lv: r[3] });
});
var TOTAL = DATA.length;

var qEl = document.getElementById("q");
var sugEl = document.getElementById("sug");
var mainEl = document.getElementById("main");
var clrEl = document.getElementById("clr");
var toastEl = document.getElementById("toast");
var tabsEl = document.getElementById("tabs");
document.getElementById("sub").textContent = NAMES.length + " 位玩家 · " + TOTAL + " 条资源地";

var kindFilter = "全部";

["全部"].concat(KINDS).forEach(function (k) {
  var b = document.createElement("button");
  b.className = "tab" + (k === "全部" ? " on" : "");
  b.textContent = k;
  b.onclick = function () {
    kindFilter = k;
    Array.prototype.forEach.call(tabsEl.children, function (x) {
      x.className = "tab" + (x.textContent === k ? " on" : "");
    });
    renderMain();
  };
  tabsEl.appendChild(b);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&amp;";
    if (c === "<") return "&lt;";
    if (c === ">") return "&gt;";
    if (c === '"') return "&quot;";
    return "&#39;";
  });
}
function key(s) { return String(s).toLowerCase().replace(/[丨|\s·]/g, ""); }

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { toastEl.classList.remove("on"); }, 1700);
}

function copyText(text, msg) {
  function done() { toast(msg || ("已复制 " + text)); }
  function manual() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-100px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { toast("长按坐标可手动复制"); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(manual);
  } else { manual(); }
}

function showSuggest() {
  var raw = qEl.value.trim();
  clrEl.style.display = raw ? "block" : "none";
  if (!raw) { sugEl.style.display = "none"; return; }
  var k = key(raw);
  var found = NAMES.filter(function (n) { return key(n).indexOf(k) >= 0; }).slice(0, 8);
  if (!found.length) { sugEl.style.display = "none"; return; }
  sugEl.innerHTML = found.map(function (n) {
    return '<div class="item" data-name="' + encodeURIComponent(n) + '" onclick="pick(this)">' +
      '<span class="sname">' + esc(n) + '</span><span class="cnt">' + MAP[n].length + ' 条</span></div>';
  }).join("");
  sugEl.style.display = "block";
}

function fuzzy(raw, limit) {
  var k = key(raw);
  var out = [];
  NAMES.forEach(function (n) {
    var nn = key(n), s = 0;
    if (nn === k) s = 120;
    else if (nn.indexOf(k) === 0) s = 90 - Math.abs(nn.length - k.length);
    else if (nn.indexOf(k) > 0) s = 70 - Math.abs(nn.length - k.length);
    else {
      var common = 0;
      for (var i = 0; i < k.length; i++) if (nn.indexOf(k.charAt(i)) >= 0) common++;
      if (k.length <= 4 && common >= 2 && common >= k.length - 1) s = common * 10;
      else if (k.length > 4 && common >= Math.ceil(k.length * 0.8)) s = common * 8;
    }
    if (s > 0) out.push([n, s]);
  });
  out.sort(function (a, b) { return b[1] - a[1]; });
  return out.slice(0, limit).map(function (x) { return x[0]; });
}

function badge(i) { return i.lv + (SHORT[i.k] || ""); }

function playerCard(name) {
  var items = MAP[name] || [];
  var visible = items.filter(function (i) { return kindFilter === "全部" || i.k === kindFilter; });
  var body = "";
  KINDS.forEach(function (k) {
    var g = visible.filter(function (i) { return i.k === k; });
    if (!g.length) return;
    g.sort(function (a, b) { return b.lv - a.lv; });
    body += '<div class="cityblock"><div class="citylabel">' + k + " · " + g.length + " 条</div>";
    g.forEach(function (i) {
      body += '<div class="row"><span class="coord">' + esc(i.coord) + "</span>" +
        '<span class="lv' + (i.lv >= 12 ? " high" : "") + '">' + esc(badge(i)) + "</span>" +
        '<span class="spacer"></span><button class="btn-copy" data-coord="' +
        encodeURIComponent(i.coord) + '" onclick="doCopy(this)">复制坐标</button></div>';
    });
    body += "</div>";
  });
  if (!body) body = '<div class="hint">' + kindFilter + " 没有他的资源地</div>";
  return '<div class="card"><div class="card-head"><div class="pname">' + esc(name) +
    '</div><button class="btn-all" data-name="' + encodeURIComponent(name) +
    '" onclick="copyAll(this)">一键复制 ' + visible.length + '</button>' +
    '<div class="pcount">共 ' + items.length + " 条</div></div>" + body + "</div>";
}

function renderMain() {
  var raw = qEl.value.trim();
  if (!raw) {
    mainEl.innerHTML = '<div class="hint">输入游戏名字即可查询他的资源地<br>只记得一部分也能搜，例如「奶丨」</div>' +
      '<div class="names">' + NAMES.map(function (n) {
        return '<button class="nbtn" data-name="' + encodeURIComponent(n) + '" onclick="pick(this)">' + esc(n) + "</button>";
      }).join("") + "</div>";
    return;
  }
  var k = key(raw);
  var exact = null;
  if (MAP[raw]) exact = raw;
  else {
    for (var i = 0; i < NAMES.length; i++) {
      if (key(NAMES[i]) === k) { exact = NAMES[i]; break; }
    }
  }
  if (exact) { mainEl.innerHTML = playerCard(exact); return; }

  var hits = fuzzy(raw, 20);
  if (hits.length === 1) { mainEl.innerHTML = playerCard(hits[0]); return; }
  if (hits.length > 1) {
    mainEl.innerHTML = '<div class="card"><div class="card-head"><div class="pname">匹配到 ' + hits.length +
      ' 位玩家</div><div class="pcount">点名字查看</div></div>' +
      hits.map(function (n) {
        return '<div class="row"><span class="pname" style="font-size:15px;font-weight:500">' + esc(n) +
          '</span><span class="cnt" style="color:#9aa0aa;font-size:12px">' + MAP[n].length + ' 条</span>' +
          '<span class="spacer"></span><button class="viewbtn" data-name="' + encodeURIComponent(n) + '" onclick="pick(this)">查看</button></div>';
      }).join("") + "</div>";
    return;
  }
  mainEl.innerHTML = '<div class="nothing"><b>没查到「' + esc(raw) + '」</b>确认一下名字有没有输错</div>';
}

function pick(el) {
  var name = decodeURIComponent(el.getAttribute("data-name"));
  qEl.value = name;
  clrEl.style.display = "block";
  sugEl.style.display = "none";
  renderMain();
  window.scrollTo(0, 0);
}
function doCopy(el) {
  copyText(decodeURIComponent(el.getAttribute("data-coord")));
}
function copyAll(el) {
  var name = decodeURIComponent(el.getAttribute("data-name"));
  var items = (MAP[name] || []).filter(function (i) {
    return kindFilter === "全部" || i.k === kindFilter;
  });
  if (!items.length) { toast("没有可复制的坐标"); return; }
  var text = items.map(function (i) { return i.coord; }).join("\n");
  copyText(text, "已复制 " + items.length + " 个坐标（" + kindFilter + "）");
}
qEl.addEventListener("input", function () { showSuggest(); renderMain(); });
qEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { sugEl.style.display = "none"; qEl.blur(); renderMain(); }
});
function clearAll() {
  qEl.value = ""; sugEl.style.display = "none"; clrEl.style.display = "none"; renderMain();
}
document.getElementById("go").addEventListener("click", function () {
  sugEl.style.display = "none"; qEl.blur(); renderMain();
});

renderMain();
</script>
