<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北境园区 · 土地快查</title>
<style>
:root{
  --ink:#0b1015; --panel:#141c24; --panel2:#1a232d; --line:#26323f;
  --ice:#8fb9dc; --ice2:#5d88a8; --gold:#c9a86a; --text:#e8eff5; --muted:#8b9bab;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--text);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  font-size:15px; line-height:1.55;
  background-image:radial-gradient(1200px 500px at 50% -180px, rgba(143,185,220,.18), transparent 70%),
                    radial-gradient(700px 400px at 85% 0%, rgba(201,168,106,.08), transparent 70%);
  background-repeat:no-repeat;
  padding-bottom:40px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px;}

/* ---------- 头部 ---------- */
header{padding:26px 0 6px;}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--ice);font-size:12px;letter-spacing:.22em;}
.eyebrow::before{content:"";width:16px;height:1px;background:var(--ice);opacity:.7;}
h1{margin:8px 0 4px;font-size:30px;line-height:1.2;letter-spacing:.04em;font-weight:700;}
h1 .gold{color:var(--gold);}
.sub{color:var(--muted);font-size:13px;}
.sub b{color:var(--ice);font-weight:600;}

/* ---------- 搜索 ---------- */
.searchbox{position:sticky;top:0;z-index:20;padding:14px 0 10px;background:linear-gradient(180deg,var(--ink) 62%,rgba(11,16,21,0));margin-top:12px;}
.field{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
.field:focus-within{border-color:rgba(143,185,220,.55);box-shadow:0 0 0 3px rgba(143,185,220,.10);}
.field svg{flex:0 0 auto;width:18px;height:18px;fill:var(--ice2);}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:16px;}
#q::placeholder{color:#5f7085;}
.clear{display:none;border:0;background:var(--panel2);color:var(--muted);border-radius:8px;padding:4px 9px;font-size:12px;}
.clear.on{display:block;}

/* ---------- 筛选 ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip-filter{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;}
.chip-filter.on{background:rgba(143,185,220,.14);border-color:rgba(143,185,220,.5);color:var(--ice);}

/* ---------- 空状态 ---------- */
.idle{line-height:2;}

/* ---------- 详情卡 ---------- */
.card{margin-top:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;}
.card-hd{padding:14px 14px 10px;background:linear-gradient(180deg,rgba(143,185,220,.10),transparent);}
.card-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.card-title .name{font-size:19px;font-weight:700;letter-spacing:.02em;}
.card-title .idx{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums;}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.pill{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;}
.pill b{color:var(--text);font-weight:600;}
.pill.t12{border-color:rgba(201,168,106,.45);color:#d8bd85;}
.pill.t11{border-color:rgba(143,185,220,.45);color:var(--ice);}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:10px;background:#0e151b;}
.bar span{display:block;height:100%;}
.b12{background:linear-gradient(90deg,#c9a86a,#e0c491);}
.b11{background:linear-gradient(90deg,#5d88a8,#8fb9dc);}
.b10{background:linear-gradient(90deg,#33414f,#4a5c6e);}

.acts{display:flex;gap:8px;padding:10px 14px 4px;}
.btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 10px;font-size:13px;}
.btn.primary{background:rgba(143,185,220,.16);border-color:rgba(143,185,220,.5);color:#cfe4f5;}

.grp{padding:4px 14px 6px;}
.grp-hd{display:flex;align-items:center;gap:8px;padding:8px 0 6px;}
.grp-hd .lv{font-weight:700;letter-spacing:.06em;}
.grp-hd .lv.l12{color:var(--gold);} .grp-hd .lv.l11{color:var(--ice);} .grp-hd .lv.l10{color:#94a7b8;}
.grp-hd .num{font-size:12px;color:var(--muted);}
.grp-hd .mini{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:#cfdae5;}
.chip:active{background:rgba(143,185,220,.18);}
.chip .ct{color:var(--muted);font-family:inherit;}

.empty{margin-top:16px;padding:26px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px;}
.empty b{color:var(--ice);}
.empty em{display:block;margin-top:8px;font-style:normal;font-size:12px;opacity:.65;}

/* ---------- 切换 ---------- */
.tabs{display:flex;gap:8px;margin:14px 0 2px;}
.tab{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;
  padding:9px 10px;font-size:13px;cursor:pointer;}
.tab.on{background:rgba(201,168,106,.13);border-color:rgba(201,168,106,.5);color:#e2c893;font-weight:600;}

/* ---------- 底部 ---------- */
footer{margin-top:22px;color:#5f7085;font-size:12px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px;}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#e8eff5;color:#0b1015;font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45);}
.toast.on{opacity:1;transform:translate(-50%,0);}
@media (max-width:480px){ h1{font-size:26px;} .cnt{display:none;} }
</style>
</head>

const state = { q: '', county: '全部', mode: 'main', open: new Set() };

/* ---------- 工具 ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('on'), 1500);
}
function copyText(text, label){
  const done = ()=>toast(label || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else { fallback(text, done); }
}
function fallback(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 每次渲染的当前过滤 ---------- */
function visibleParcels(m){
  if (state.county === '全部') return m.parcels;
  return m.parcels.filter(p=>p.county===state.county);
}
function groupByLevel(parcels){
  const g = {'12':[], '11':[], '10':[]};
  parcels.forEach(p=>g[p.lv].push(p));
  return g;
}

/* 复制文案：单块 / 某级 / 全部 */
function textAll(m, parcels){
  const g = groupByLevel(parcels);
  let out = `【${DATA.team}·土地】${m.name}｜共${parcels.length}块\n`;
  ['12','11','10'].forEach(lv=>{
    if (!g[lv].length) return;
    out += `${lv}级(${g[lv].length})：` + g[lv].map(p=>`${p.county}·${p.code}`).join('、') + '\n';
  });
  return out.trim();
}
function textLevel(m, lv, parcels){
  return `${m.name}｜${lv}级地（${parcels.length}块）：\n` + parcels.map(p=>`${p.county}·${p.code}`).join('\n');
}

/* ---------- 渲染 ---------- */
function curSet(){ return state.mode === 'lv9' ? DATA.lv9 : DATA; }
function setTotal(set){ return set.total != null ? set.total : set.totalParcels; }
function render(){
  const out = document.getElementById('out');
  const kw = state.q.trim();
  const set = curSet();

  if (kw){
    const hits = set.members.filter(m=>m.name.includes(kw));
    if (!hits.length){
      out.innerHTML = `<div class="empty">没有找到「${esc(kw)}」<br>可只输入名字里的两个字再试试</div>`;
      return;
    }
    out.innerHTML = hits.map(state.mode === 'lv9' ? card9HTML : cardHTML).join('');
  } else {
    const tip = state.mode === 'lv9' ? '输入游戏名字，查看自己分到的九级地' : '输入游戏名字，查看自己分到的地';
    out.innerHTML = `<div class="empty idle">${tip}<br><em>共 ${set.members.length} 人 · ${setTotal(set)} 块地</em></div>`;
  }
}

function card9HTML(m){
  const parcels = visibleParcels(m);
  const byC = {};
  parcels.forEach(p=>{ (byC[p.county] = byC[p.county] || []).push(p); });
  const grpHTML = Object.keys(byC).length ? Object.keys(byC).map(c=>`
    <div class="grp">
      <div class="grp-hd">
        <span class="lv l10">${esc(c)}</span>
        <span class="num">${byC[c].length} 块</span>
        <span class="mini" data-copy-lv9="${esc(m.name)}|${esc(c)}">复制本州</span>
      </div>
      <div class="chips">${byC[c].map(p=>`<span class="chip" data-copy="${esc(m.name)}|${esc(p.county)}|${esc(p.land + p.code)}"><span class="ct">${esc(p.county)}</span> ${esc(p.land + p.code)}</span>`).join('')}</div>
    </div>`).join('') : `<div class="grp"><div class="empty" style="margin:10px 0">该州没有分到九级地</div></div>`;

  return `<div class="card" data-card="${esc(m.name)}">
    <div class="card-hd">
      <div class="card-title">
        <span class="idx">No.${m.r}</span>
        <span class="name">${esc(m.name)}</span>
      </div>
      <div class="pills">
        <span class="pill">九级地 合计 <b>${m.total}</b> 块</span>
      </div>
    </div>
    <div class="acts">
      <button class="btn primary" data-copy9-all="${esc(m.name)}">复制全部九级地</button>
    </div>
    ${grpHTML}
  </div>`;
}

function cardHTML(m){
  const parcels = visibleParcels(m);
  const g = groupByLevel(parcels);
  const pct = v => (v / m.total * 100).toFixed(2) + '%';

  const grpHTML = ['12','11','10'].map(lv=>{
    if (!g[lv].length) return '';
    return `<div class="grp">
      <div class="grp-hd">
        <span class="lv l${lv}">${lv} 级</span>
        <span class="num">${g[lv].length} 块</span>
        <span class="mini" data-copy-lv="${esc(m.name)}|${lv}">复制本级</span>
      </div>
      <div class="chips">${g[lv].map(p=>`<span class="chip" data-copy="${esc(m.name)}|${esc(p.county)}|${esc(p.code)}"><span class="ct">${esc(p.county)}</span> ${esc(p.code)}</span>`).join('')}</div>
    </div>`;
  }).join('') || `<div class="grp"><div class="empty" style="margin:10px 0">该州郡没有分到地</div></div>`;

  return `<div class="card" data-card="${esc(m.name)}">
    <div class="card-hd">
      <div class="card-title">
        <span class="idx">No.${m.r}</span>
        <span class="name">${esc(m.name)}</span>
      </div>
      <div class="pills">
        <span class="pill">合计 <b>${m.total}</b> 块</span>
        <span class="pill t12">12级 ${m.n12}</span>
        <span class="pill t11">11级 ${m.n11}</span>
        <span class="pill">10级 ${m.n10}</span>
      </div>
    </div>
    <div class="acts">
      <button class="btn primary" data-copy-all="${esc(m.name)}">复制全部地块</button>
      <button class="btn" data-copy-all="county|${esc(m.name)}">复制当前州郡</button>
    </div>
    ${grpHTML}
  </div>`;
}

/* ---------- 交互 ---------- */
document.getElementById('q').addEventListener('input', e=>{
  state.q = e.target.value;
  document.getElementById('clr').classList.toggle('on', !!state.q);
  render();
});
document.getElementById('clr').addEventListener('click', ()=>{
  state.q = '';
  document.getElementById('q').value = '';
  document.getElementById('clr').classList.remove('on');
  render();
});

document.getElementById('filters').addEventListener('click', e=>{
  const b = e.target.closest('.chip-filter');
  if (!b) return;
  state.county = b.dataset.county;
  document.querySelectorAll('.chip-filter').forEach(x=>x.classList.toggle('on', x===b));
  render();
});

document.getElementById('out').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if (chip){
    const [name, county, code] = chip.dataset.copy.split('|');
    copyText(`${county}·${code}`, `已复制 ${code}`);
    return;
  }
  const lv9Btn = e.target.closest('[data-copy-lv9]');
  if (lv9Btn){
    const [name, county] = lv9Btn.dataset.copyLv9.split('|');
    const m = DATA.lv9.members.find(x=>x.name===name);
    const ps = m.parcels.filter(p=>p.county===county);
    copyText(`${m.name}｜${county} 九级地（${ps.length}块）：\n` + ps.map(p=>`${p.county}·${p.land}${p.code}`).join('\n'),
      `已复制 ${name} 的 ${county} 九级地`);
    return;
  }
  const lv9All = e.target.closest('[data-copy9-all]');
  if (lv9All){
    const name = lv9All.dataset.copy9All;
    const m = DATA.lv9.members.find(x=>x.name===name);
    const ps = visibleParcels(m);
    if (!ps.length){ toast('该州没有地'); return; }
    let txt = `【${DATA.team}·九级地】${m.name}｜共${ps.length}块\n`;
    const byC = {};
    ps.forEach(p=>{ (byC[p.county] = byC[p.county] || []).push(p); });
    Object.keys(byC).forEach(c=>{
      txt += `${c}(${byC[c].length})：` + byC[c].map(p=>`${p.land}${p.code}`).join('、') + '\n';
    });
    copyText(txt.trim(), `已复制 ${name} 的 ${ps.length} 块九级地`);
    return;
  }
  const lvBtn = e.target.closest('[data-copy-lv]');
  if (lvBtn){
    const [name, lv] = lvBtn.dataset.copyLv.split('|');
    const m = DATA.members.find(x=>x.name===name);
    const g = groupByLevel(m.parcels);
    copyText(textLevel(m, lv, g[lv]), `已复制 ${name} 的 ${lv} 级 ${g[lv].length} 块`);
    return;
  }
  const allBtn = e.target.closest('[data-copy-all]');
  if (allBtn){
    const val = allBtn.dataset.copyAll;
    let name, parcels;
    if (val.startsWith('county|')){
      name = val.slice(7);
      const m = DATA.members.find(x=>x.name===name);
      parcels = visibleParcels(m);
      if (!parcels.length){ toast('该州郡没有地'); return; }
    } else {
      name = val;
      const m = DATA.members.find(x=>x.name===name);
      parcels = m.parcels;
    }
    const m = DATA.members.find(x=>x.name===name);
    copyText(textAll(m, parcels), `已复制 ${name} 的 ${parcels.length} 块地`);
  }
});

/* ---------- 模式切换 ---------- */
function buildFilters(){
  const set = curSet();
  const f = document.getElementById('filters');
  const tot = setTotal(set);
  const parts = ['全部'].concat(set.counties);
  f.innerHTML = parts.map(c=>{
    const n = c==='全部' ? tot : set.countyCount[c];
    const on = (state.county === c) ? 'on' : (state.county === '全部' && c === '全部' ? 'on' : '');
    return `<button class="chip-filter ${on}" data-county="${esc(c)}">${esc(c)} <span style="opacity:.6">${n}</span></button>`;
  }).join('');
  document.getElementById('tp').textContent = tot;
  document.getElementById('tm').textContent = set.members.length;
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('.tab');
  if (!b) return;
  state.mode = b.dataset.mode;
  state.county = '全部';
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===b));
  buildFilters();
  render();
});

/* ---------- 初始化 ---------- */
(function init(){
  buildFilters();
  render();
})();
</script>
</body>
</html>
